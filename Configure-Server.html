<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sven Co-op LAN Server</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101a23;color:#e5edf3}body{max-width:960px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin-bottom:8px}h2{font-size:20px;color:#7ddace}section{background:#172733;border:1px solid #2a424f;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;border-radius:6px;padding:9px;border:1px solid #456170;background:#0e1b24;color:inherit}input,textarea{box-sizing:border-box;width:100%}textarea{min-height:130px}button{cursor:pointer;margin:4px}button.primary{background:#26756b}button:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.hint{color:#adc2cf;font-size:14px}#message{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-left:3px solid #7ddace}pre{white-space:pre-wrap} @media(max-width:650px){.grid{display:block}header{display:block}}
</style>
<header><div><h1>Sven Co-op 3.0</h1><span class="hint">Classic LAN · Linux Mint / Wine · Preview 0.1.0</span></div><select id="language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option></select></header>
<p id="message" role="status">Start-Panel.sh starten / Run Start-Panel.sh</p>
<section><h2 data-de="Serversteuerung" data-en="Server control"></h2><p id="status"></p><button id="start" class="primary" data-de="Server starten" data-en="Start server"></button><button id="stop" data-de="Server stoppen" data-en="Stop server"></button><button id="refresh" data-de="Aktualisieren" data-en="Refresh"></button></section>
<form id="form"><section><h2 data-de="Einstellungen" data-en="Settings"></h2><p class="hint" data-de="Vor dem Speichern den Server stoppen. Änderungen gelten beim nächsten Start." data-en="Stop the server before saving. Changes apply on the next start."></p><div class="grid" id="fields"></div></section>
<section><h2 data-de="Karten und Kampagnen" data-en="Maps and campaigns"></h2><p class="hint" data-de="Eine Karte pro Zeile. Bei Kampagnen nur den Anfang nominieren. Natürliche Kampagnenübergänge bleiben erhalten." data-en="One map per line. Nominate campaign starts. Natural campaign transitions are preserved."></p><textarea id="rotation" aria-label="Map rotation" spellcheck="false"></textarea><details><summary data-de="Installierte Karten" data-en="Installed maps"></summary><pre id="maps"></pre></details></section>
<section><h2 data-de="Begrüßung" data-en="Welcome message"></h2><textarea id="motd" aria-label="Welcome message"></textarea></section><button class="primary" id="save" data-de="Mit Sicherung speichern" data-en="Save with backup"></button></form>
<section><h2 data-de="Spielerprofile und Ranking" data-en="Player profiles and ranking"></h2><p class="hint" data-de="Koop-Punkte, Tode und Spielzeit. Gäste erhalten Sitzungsstatistiken. Der Zugangsschlüssel ist vom Adminpasswort getrennt." data-en="Co-op points, deaths and playtime. Guests receive session statistics. Profile tokens are separate from admin passwords."></p><label><span data-de="Neues Profil" data-en="New profile"></span><input id="profile" maxlength="31" placeholder="Player2"></label><button id="addProfile" data-de="Profil anlegen" data-en="Create profile"></button><pre id="profileResult"></pre></section>
<section><h2 data-de="Chatsounds und Administration" data-en="Chat sounds and administration"></h2><p class="hint" data-de="Soundbefehle sind aktiviert (10 Sekunden Pause, 20 pro Spieler/Karte). Zugangsdaten stehen ausschließlich in ADMIN.local.txt im Serverordner." data-en="Chat sounds are enabled (10-second cooldown, 20 per player/map). Credentials are stored only in ADMIN.local.txt in the server folder."></p><details><summary data-de="Soundbefehle anzeigen" data-en="Show sound commands"></summary><pre id="sounds"></pre></details></section>
<script>
const $=id=>document.getElementById(id),token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let language='de',state;
const labels={name:['Servername','Server name'],slots:['Spielerplätze','Player slots'],port:['UDP-Port','UDP port'],map:['Startkarte','Start map'],minutes:['Einzelkarten: Minuten','Single-map minutes'],skill:['Schwierigkeit (1–3)','Difficulty (1–3)'],bind:['Bind-Adresse (0.0.0.0 = alle)','Bind address (0.0.0.0 = all)'],admin:['Adminname','Admin name']};
function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-de]').forEach(e=>e.textContent=e.dataset[language]);if(state)render();}
function tell(message){$('message').textContent=message;}
async function api(path,data){let r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'X-Panel-Token':token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j;}
function render(){ $('status').textContent=state.running?(language==='de'?'Prozess läuft – Spielverbindung separat prüfen.':'Process running – verify game connectivity separately.'):(language==='de'?'Server gestoppt':'Server stopped');$('start').disabled=state.running;$('stop').disabled=!state.running;$('save').disabled=state.running;$('addProfile').disabled=state.running;$('fields').replaceChildren();for(let [key,value] of Object.entries(state.settings)){let label=document.createElement('label');label.textContent=labels[key][language==='de'?0:1];let input=document.createElement('input');input.id='field-'+key;input.value=value;input.disabled=state.running;if(typeof value==='number')input.type='number';label.append(input);$('fields').append(label);}$('rotation').value=state.rotation;$('motd').value=state.motd;$('maps').textContent=state.maps.join('\n');$('sounds').textContent=state.sounds;}
async function refresh(){state=await api('state');render();}
function action(fn){return async e=>{e.preventDefault();try{await fn();}catch(error){tell(error.message);}};}
$('language').onchange=()=>{language=$('language').value;translate();};$('refresh').onclick=action(refresh);
for(const a of ['start','stop'])$(a).onclick=action(async()=>{tell(language==='de'?'Bitte warten …':'Please wait …');await api(a,{});await refresh();tell(language==='de'?'Aktion ausgeführt.':'Action completed.');});
$('form').onsubmit=action(async()=>{let settings={};for(let [key,value] of Object.entries(state.settings))settings[key]=typeof value==='number'?Number($('field-'+key).value):$('field-'+key).value;await api('save',{settings,rotation:$('rotation').value,motd:$('motd').value});await refresh();tell(language==='de'?'Gespeichert.':'Saved.');});
$('addProfile').onclick=action(async()=>{let r=await api('profile',{label:$('profile').value});$('profileResult').textContent=r.clientCommand;tell(language==='de'?'Diese private Zeile im Spielclient speichern.':'Save this private line in the game client.');});
translate();if(token)refresh().catch(e=>tell(e.message));else tell('Bitte über Start-Panel.sh öffnen. / Open using Start-Panel.sh.');
</script></html>
